[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-dropbox"
version = "0.1.0"
description = "MCP server for Dropbox with full CRUD on files, folders, sharing, revisions, and upload sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "dropbox>=12.0.0",
]

[project.scripts]
mcp-dropbox = "mcp_dropbox.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dropbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
